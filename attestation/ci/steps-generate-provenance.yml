# Reusable CI steps for generating provenance attestations
# Usage: Include these steps in your workflow job

# Example usage in a workflow:
# jobs:
#   build:
#     steps:
#       - uses: actions/checkout@v4
#       - name: Generate provenance
#         run: |
#           source attestation/ci/steps-generate-provenance.yml
#           # Or use the individual steps below

# Step 1: Ensure script is executable
- name: Prepare provenance script
  run: chmod +x attestation/scripts/generate-provenance.sh

# Step 2: Generate provenance attestation
- name: Generate provenance attestation
  run: bash attestation/scripts/generate-provenance.sh "${PROVENANCE_OUTPUT:-attestation/output/provenance.json}"
  env:
    GITHUB_SHA: ${{ github.sha }}
    GITHUB_REPOSITORY: ${{ github.repository }}
    GITHUB_WORKFLOW: ${{ github.workflow }}
    GITHUB_RUN_ID: ${{ github.run_id }}
    GITHUB_REF_NAME: ${{ github.ref_name }}

# Step 3: Upload provenance as artifact (optional)
- name: Upload provenance attestation
  uses: actions/upload-artifact@v4
  with:
    name: provenance-attestation
    path: "${PROVENANCE_OUTPUT:-attestation/output/provenance.json}"
    if-no-files-found: warn

